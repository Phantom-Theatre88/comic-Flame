<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manga Panel Designer v0.7</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#222}iframe{border:0;width:100%;height:100%;display:block}</style>
</head>
<body>
<iframe id="appFrame" src="index.html" title="Manga Panel Designer v0.7"></iframe>
<script>
const frame=document.getElementById('appFrame');
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;
  const load=(src,next)=>{const s=doc.createElement('script');s.src=src;s.onload=()=>next&&next();doc.body.appendChild(s);};
  load('v06.js',()=>load('v07.js'));
});
</script>
</body>
</html>
